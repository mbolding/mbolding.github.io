<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <meta name="description" content="A plain countdown for a single block of focused work.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../archive.css">
    <style>
        :root {
            --page-bg: #f0e6d2;
            --panel: #ffffff;
            --ink: #4a3a28;
            --ink-soft: #7c6a55;
            --rule: #8b4513;
            --btn: #8b4513;
            --btn-hover: #a0522d;
            --btn-fg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.12);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --page-bg: #16130f;
                --panel: #201b16;
                --ink: #ece2d2;
                --ink-soft: #a89c8a;
                --rule: #c98a52;
                --btn: #c98a52;
                --btn-hover: #dba065;
                --btn-fg: #1d1710;
                --shadow: rgba(0, 0, 0, 0.5);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Special Elite', 'Courier New', monospace;
            color: var(--ink);
            background-color: var(--page-bg);
        }

        main {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 46px);
            padding: 32px 20px 64px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 28px 24px 32px;
            text-align: center;
            background-color: var(--panel);
            border: 2px solid var(--rule);
            border-radius: 10px;
            box-shadow: 0 4px 14px var(--shadow);
        }

        h1 {
            margin: 0;
            color: var(--rule);
            font-size: 1.6rem;
            font-weight: 400;
        }

        .lede {
            margin: 6px 0 0;
            color: var(--ink-soft);
            font-size: 0.85rem;
        }

        #timer {
            margin: 18px 0 4px;
            font-size: clamp(3rem, 18vw, 4.5rem);
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        #timer.is-done {
            color: var(--rule);
        }

        #status {
            min-height: 1.4em;
            margin: 0 0 20px;
            color: var(--ink-soft);
            font-size: 0.9rem;
        }

        .field {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="number"] {
            width: 84px;
            padding: 8px;
            color: inherit;
            font: inherit;
            font-size: 1rem;
            text-align: center;
            background-color: var(--page-bg);
            border: 1px solid var(--rule);
            border-radius: 4px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        button {
            flex: 1 1 120px;
            padding: 12px 20px;
            color: var(--btn-fg);
            font: inherit;
            font-size: 1rem;
            background-color: var(--btn);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: var(--btn-hover);
        }

        button[hidden] {
            display: none;
        }

        .secondary {
            color: var(--btn);
            background-color: transparent;
            border: 1px solid var(--btn);
        }

        .secondary:hover {
            color: var(--btn-fg);
            background-color: var(--btn);
        }

        .sound-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            color: var(--ink-soft);
            font-size: 0.85rem;
            cursor: pointer;
        }
    </style>
</head>

<body class="ar-touch ar-motion">
    <nav class="ar-bar">
        <a href="../archive.html">&larr; Archive</a>
        <span class="ar-here">Focus Timer</span>
        <span class="ar-spacer"></span>
        <a href="index.html">Writing</a>
    </nav>

    <main>
        <div class="container">
            <h1>Focus Timer</h1>
            <p class="lede">One block. No quotes, no ticking.</p>

            <div id="timer" role="timer" aria-live="off">25:00</div>
            <p id="status" role="status" aria-live="polite">Ready.</p>

            <div class="field">
                <input type="number" id="minutes" min="1" max="180" step="1" value="25"
                    aria-label="Length of the block in minutes">
                <label for="minutes">minutes</label>
            </div>

            <div class="buttons">
                <button type="button" id="primary">Start</button>
                <button type="button" id="reset" class="secondary">Reset</button>
            </div>

            <label class="sound-toggle">
                <input type="checkbox" id="sound" checked>
                Chime when the block ends
            </label>
        </div>
    </main>

    <script>
        (function () {
            var display = document.getElementById('timer');
            var status = document.getElementById('status');
            var minutesInput = document.getElementById('minutes');
            var primary = document.getElementById('primary');
            var resetBtn = document.getElementById('reset');
            var soundToggle = document.getElementById('sound');

            var DEFAULT_TITLE = document.title;

            // State is a deadline, not a countdown. setInterval drifts, and a
            // background tab has its timers throttled to once a minute or
            // stopped outright, so counting ticks loses real time. Deadline
            // minus now is correct however long the tab was asleep.
            var deadline = 0;        // ms timestamp the block ends
            var paused = 0;          // ms remaining when paused
            var running = false;
            var frame = null;

            function plannedSeconds() {
                var m = parseInt(minutesInput.value, 10);
                if (!isFinite(m) || m < 1) m = 1;
                if (m > 180) m = 180;
                return m * 60;
            }

            function format(ms) {
                var total = Math.max(0, Math.ceil(ms / 1000));
                var m = Math.floor(total / 60);
                var s = total % 60;
                return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }

            function paint(ms) {
                var t = format(ms);
                display.textContent = t;
                document.title = running ? t + ' — ' + DEFAULT_TITLE : DEFAULT_TITLE;
            }

            // --- sound -------------------------------------------------------
            // The context is created on the first click, never at load: browsers
            // start a page's audio suspended and only a user gesture may resume
            // it, so a context built at load time stays silent forever.
            var ctx = null;

            function audio() {
                if (!soundToggle.checked) return null;
                try {
                    if (!ctx) {
                        var AC = window.AudioContext || window.webkitAudioContext;
                        if (!AC) return null;
                        ctx = new AC();
                    }
                    if (ctx.state === 'suspended') ctx.resume();
                    return ctx;
                } catch (e) {
                    return null;
                }
            }

            function chime(freq, seconds) {
                var c = audio();
                if (!c) return;
                var osc = c.createOscillator();
                var gain = c.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, c.currentTime);
                // Ramp from an audible floor: an exponential ramp that starts
                // at zero is a no-op, which is the usual way these go silent.
                gain.gain.setValueAtTime(0.0001, c.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.3, c.currentTime + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + seconds);
                osc.connect(gain);
                gain.connect(c.destination);
                osc.start();
                osc.stop(c.currentTime + seconds + 0.02);
            }

            // --- loop --------------------------------------------------------
            function tick() {
                var left = deadline - Date.now();
                if (left <= 0) {
                    finish();
                    return;
                }
                paint(left);
                frame = setTimeout(tick, 200);
            }

            function finish() {
                running = false;
                clearTimeout(frame);
                frame = null;
                paint(0);
                display.classList.add('is-done');
                primary.textContent = 'Start';
                minutesInput.disabled = false;
                status.textContent = 'Block finished.';
                document.title = 'Done — ' + DEFAULT_TITLE;
                chime(880, 0.6);
            }

            function start(ms) {
                deadline = Date.now() + ms;
                running = true;
                display.classList.remove('is-done');
                primary.textContent = 'Pause';
                minutesInput.disabled = true;
                status.textContent = 'Running.';
                chime(440, 0.12);
                paint(ms);
                clearTimeout(frame);
                frame = setTimeout(tick, 200);
            }

            function pause() {
                paused = Math.max(0, deadline - Date.now());
                running = false;
                clearTimeout(frame);
                frame = null;
                primary.textContent = 'Resume';
                status.textContent = 'Paused at ' + format(paused) + '.';
                paint(paused);
                chime(330, 0.1);
            }

            function reset() {
                running = false;
                paused = 0;
                clearTimeout(frame);
                frame = null;
                display.classList.remove('is-done');
                primary.textContent = 'Start';
                minutesInput.disabled = false;
                status.textContent = 'Ready.';
                paint(plannedSeconds() * 1000);
            }

            primary.addEventListener('click', function () {
                if (running) {
                    pause();
                } else if (paused > 0) {
                    // Resume picks up the remaining time rather than
                    // restarting the block from the top.
                    var left = paused;
                    paused = 0;
                    start(left);
                } else {
                    start(plannedSeconds() * 1000);
                }
            });

            resetBtn.addEventListener('click', reset);

            minutesInput.addEventListener('input', function () {
                if (!running && paused === 0) paint(plannedSeconds() * 1000);
            });

            // Coming back to a tab that slept through the end should show the
            // end, not a stale number frozen where the throttling stopped it.
            document.addEventListener('visibilitychange', function () {
                if (!document.hidden && running) tick();
            });

            paint(plannedSeconds() * 1000);
        }());
    </script>
</body>

</html>
