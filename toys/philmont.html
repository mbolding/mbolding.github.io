<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Like You're at Philmont</title>
    <meta name="description" content="A Philmont habits checklist that remembers where you left off.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../archive.css">
    <style>
        :root {
            --theme: #2c5f2d;
            --theme-deep: #5c4033;
            --accent: #ce1126;
            --accent-hover: #a60d1b;
            --page-bg: #f0e6d2;
            --panel: rgba(255, 255, 255, 0.92);
            --fg: #4a3c30;
            --muted: #6b6257;
            --track: #d9b382;
            --shadow: rgba(0, 0, 0, 0.12);
            --noise: 0.55;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --theme: #7fb069;
                --theme-deep: #8a7a68;
                --accent: #e04a5a;
                --accent-hover: #c33947;
                --page-bg: #14120e;
                --panel: rgba(30, 27, 22, 0.92);
                --fg: #ece5d8;
                --muted: #a8a094;
                --track: #3a3229;
                --shadow: rgba(0, 0, 0, 0.5);
                --noise: 0.16;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Cabin', Arial, sans-serif;
            color: var(--fg);
            background-color: var(--page-bg);
        }

        .background {
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: var(--noise);
            filter: blur(1px);
            pointer-events: none;
            z-index: -1;
        }

        .content {
            max-width: 800px;
            margin: 0 auto;
            padding: 32px 20px 64px;
        }

        h1 {
            margin: 0 0 8px;
            color: var(--theme);
            font-size: clamp(1.9rem, 6vw, 2.5rem);
            text-align: center;
        }

        .lede {
            margin: 0 0 28px;
            color: var(--muted);
            text-align: center;
        }

        .checklist {
            padding: 8px 20px 20px;
            border: 0;
            border-radius: 6px;
            background-color: var(--panel);
            box-shadow: 0 4px 10px var(--shadow);
        }

        .checklist legend {
            padding: 0 8px;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 8px;
            border-radius: 4px;
        }

        .item + .item {
            border-top: 1px solid color-mix(in srgb, var(--fg) 10%, transparent);
        }

        .item:hover {
            background-color: color-mix(in srgb, var(--theme) 8%, transparent);
        }

        .item input[type="checkbox"] {
            flex: none;
            width: 20px;
            height: 20px;
            accent-color: var(--theme);
            cursor: pointer;
        }

        .item label {
            flex: 1;
            cursor: pointer;
        }

        .item input:checked + label {
            color: var(--theme);
            font-weight: 700;
        }

        #progress-container {
            position: relative;
            height: 32px;
            margin-top: 24px;
            border: 2px solid var(--theme-deep);
            border-radius: 5px;
            background-color: var(--track);
            overflow: hidden;
        }

        #progress-bar {
            width: 0;
            height: 100%;
            background-color: var(--theme);
            transition: width 0.4s ease-in-out;
        }

        #progress-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--fg);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        #message {
            min-height: 1.6em;
            margin-top: 18px;
            color: var(--theme);
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
        }

        #reset-button {
            display: block;
            margin: 24px auto 0;
            padding: 12px 24px;
            color: #ffffff;
            font-family: inherit;
            font-size: 1rem;
            background-color: var(--accent);
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 6px var(--shadow);
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        #reset-button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .saved-note {
            margin-top: 14px;
            color: var(--muted);
            font-size: 0.8rem;
            text-align: center;
        }
    </style>
</head>

<body class="ar-touch ar-motion">
    <nav class="ar-bar">
        <a href="../archive.html">&larr; Archive</a>
        <span class="ar-here">Philmont</span>
        <span class="ar-spacer"></span>
        <a href="../index.html">Commonplace Book</a>
    </nav>

    <div class="background"></div>
    <main class="content">
        <h1>Live Like You're at Philmont</h1>
        <p class="lede">Twelve habits from the New Mexico trek, for the other fifty weeks of the year.</p>

        <fieldset class="checklist" id="checklist">
            <legend>Twelve habits</legend>
            <div class="item"><input type="checkbox" id="item1"><label for="item1">Embrace outdoor activities</label></div>
            <div class="item"><input type="checkbox" id="item2"><label for="item2">Practice Leave No Trace principles</label></div>
            <div class="item"><input type="checkbox" id="item3"><label for="item3">Set challenging goals</label></div>
            <div class="item"><input type="checkbox" id="item4"><label for="item4">Develop outdoor skills</label></div>
            <div class="item"><input type="checkbox" id="item5"><label for="item5">Foster teamwork</label></div>
            <div class="item"><input type="checkbox" id="item6"><label for="item6">Simplify your lifestyle</label></div>
            <div class="item"><input type="checkbox" id="item7"><label for="item7">Practice conservation</label></div>
            <div class="item"><input type="checkbox" id="item8"><label for="item8">Embrace a service mindset</label></div>
            <div class="item"><input type="checkbox" id="item9"><label for="item9">Stay physically active</label></div>
            <div class="item"><input type="checkbox" id="item10"><label for="item10">Learn about local history and nature</label></div>
            <div class="item"><input type="checkbox" id="item11"><label for="item11">Practice mindfulness</label></div>
            <div class="item"><input type="checkbox" id="item12"><label for="item12">Cultivate self-reliance</label></div>
        </fieldset>

        <div id="progress-container" role="img" aria-labelledby="progress-text">
            <div id="progress-bar"></div>
            <div id="progress-text">0 of 12 &middot; 0%</div>
        </div>

        <p id="message" role="status" aria-live="polite"></p>

        <button type="button" id="reset-button">Reset progress</button>
        <p class="saved-note" id="saved-note">Your ticks are saved in this browser.</p>
    </main>

    <script>
        (function () {
            var STORAGE_KEY = 'philmont-checklist';
            var list = document.getElementById('checklist');
            var boxes = Array.prototype.slice.call(
                list.querySelectorAll('input[type="checkbox"]'));
            var bar = document.getElementById('progress-bar');
            var text = document.getElementById('progress-text');
            var message = document.getElementById('message');
            var note = document.getElementById('saved-note');
            var total = boxes.length;

            // Storage is unavailable in private windows and when site data is
            // blocked, so every read and write is guarded and the page works
            // the same either way — it just forgets between visits.
            var storageOk = true;

            function save() {
                if (!storageOk) return;
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(
                        boxes.filter(function (b) { return b.checked; })
                            .map(function (b) { return b.id; })));
                } catch (e) {
                    storageOk = false;
                    note.textContent = 'This browser is not saving your ticks.';
                }
            }

            function load() {
                var raw = null;
                try {
                    raw = localStorage.getItem(STORAGE_KEY);
                } catch (e) {
                    storageOk = false;
                    note.textContent = 'This browser is not saving your ticks.';
                    return;
                }
                if (!raw) return;
                try {
                    var ids = JSON.parse(raw);
                    if (!Array.isArray(ids)) return;
                    boxes.forEach(function (b) {
                        b.checked = ids.indexOf(b.id) !== -1;
                    });
                } catch (e) { /* corrupt entry, start fresh */ }
            }

            function update() {
                // Counted from the checklist only, so adding a checkbox
                // elsewhere on the page cannot skew the total.
                var done = boxes.filter(function (b) { return b.checked; }).length;
                var pct = Math.round((done / total) * 100);

                bar.style.width = pct + '%';
                text.textContent = done + ' of ' + total + ' \u00b7 ' + pct + '%';

                if (pct === 100) {
                    message.textContent = "You&rsquo;re living the Philmont life.";
                } else if (pct >= 75) {
                    message.textContent = "You&rsquo;re well on your way to the Philmont lifestyle.";
                } else if (pct >= 50) {
                    message.textContent = 'Keep it up, you\u2019re making good progress.';
                } else if (done > 0) {
                    message.textContent = "A good start. Keep at it.";
                } else {
                    message.textContent = 'Start small and work your way up.';
                }
            }

            list.addEventListener('change', function (e) {
                if (e.target.type !== 'checkbox') return;
                save();
                update();
            });

            document.getElementById('reset-button').addEventListener('click', function () {
                boxes.forEach(function (b) { b.checked = false; });
                try {
                    localStorage.removeItem(STORAGE_KEY);
                } catch (e) { /* nothing to clear */ }
                update();
            });

            load();
            update();
        }());
    </script>
</body>

</html>
