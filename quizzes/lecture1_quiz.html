            <span class="eyebrow">NBL 425/625 &middot; Lecture review &middot; 10 questions</span>
            <h1>Mathematical Foundations of Imaging</h1>
            <p class="subtitle">The linear algebra and signal processing that imaging runs on, from voxels and tensors
                to k-space and the file formats the data arrives in. Nothing is recorded and nothing is graded.</p>

            <noscript>
                <p class="noscript-note">This quiz is interactive and needs JavaScript enabled.</p>
            </noscript>
        </main>
    </div>

    <script>
        window.QUIZ = {
            questions: [
                {
                    q: "What is the main difference between a pixel and a voxel?",
                    options: ["Pixels are larger than voxels", "Pixels represent 2D elements while voxels represent 3D volume elements", "Voxels are used only in medical imaging", "There is no difference"],
                    answer: 1,
                    why: "A pixel samples a 2D image; a voxel samples a 3D volume and, in neuroimaging, has physical dimensions in millimeters. Voxels are frequently anisotropic, which is why through-slice resolution often differs from in-plane resolution."
                },
                {
                    q: "Which sequence correctly represents the dimensional progression from scalar to tensor?",
                    options: ["Tensor to matrix to vector to scalar", "Scalar to matrix to vector to tensor", "Scalar to vector to matrix to tensor", "Vector to scalar to tensor to matrix"],
                    answer: 2,
                    why: "Each step adds an index: a scalar has none, a vector has one, a matrix has two, and a tensor generalizes to arbitrary rank. The rank-2 case is exactly what diffusion tensor imaging fits in every voxel."
                },
                {
                    q: "What does the Fourier transform do to a signal?",
                    options: ["Amplifies the signal strength", "Decomposes it into its constituent frequencies", "Converts it from analog to digital", "Removes noise from the signal"],
                    answer: 1,
                    why: "It re-expresses a signal as a sum of sinusoids, giving an amplitude and a phase at each frequency. MRI depends on this directly: the scanner samples k-space, and the image is its inverse Fourier transform."
                },
                {
                    q: "In neuroimaging, what are eigenvalues and eigenvectors used for?",
                    options: ["Only for image compression", "Diagonalizing matrices, and techniques such as PCA", "Converting pixels to voxels", "Measuring brain volume"],
                    answer: 1,
                    why: "Eigenvectors are the directions a linear transformation leaves unrotated, and eigenvalues are the factors it scales them by. Diagonalization underlies PCA and ICA, and in DTI the eigenvalues and eigenvectors of the diffusion tensor yield fractional anisotropy and the local fiber direction."
                },
                {
                    q: "Which theorem states that the Fourier transform preserves the energy of a signal?",
                    options: ["The linearity property", "The convolution theorem", "Parseval's theorem", "The time-shift property"],
                    answer: 2,
                    why: "Parseval's theorem says the total energy of a signal is the same whether computed in the time domain or the frequency domain, which is why noise power can be assessed in either one."
                },
                {
                    q: "In a table of student exam scores, what would a tensor represent?",
                    options: ["A single exam score", "Scores for one student across multiple exams", "Scores for multiple students on one exam", "Scores for multiple students across multiple exams, indexed along a further dimension"],
                    answer: 3,
                    why: "One score is a scalar, one student across exams is a vector, students by exams is a matrix, and adding another index such as term or course makes it a higher-rank tensor. Neuroimaging data stacks up the same way: x, y, z, time, and subject."
                },
                {
                    q: "Which format is the standard for clinical image data?",
                    options: ["JPEG", "NIfTI", "DICOM", "PNG"],
                    answer: 2,
                    why: "DICOM is the clinical standard and carries the full acquisition metadata alongside the pixel data. NIfTI is the common research format, simpler and better suited to analysis pipelines, which is why DICOM to NIfTI conversion is usually the first step in a workflow."
                },
                {
                    q: "Which of the following is NOT a standard neuroimaging analysis package?",
                    options: ["SPM", "FSL", "AFNI", "Photoshop"],
                    answer: 3,
                    why: "SPM, FSL, and AFNI are the long-standing analysis packages, now usually used alongside FreeSurfer and ANTs. Editing a scan in a photo editor would discard both the header geometry and the quantitative voxel values."
                },
                {
                    q: "What allows a matrix to represent a linear transformation between vector spaces?",
                    options: ["Matrix determinants", "A choice of basis for each space", "Matrix subtraction", "Matrix transposition"],
                    answer: 1,
                    why: "Once a basis is fixed for the input and output spaces, every linear map has a unique matrix representation, and its columns are the images of the basis vectors. Changing basis is what lets the same transformation be written more conveniently, which is exactly what diagonalization does."
                },
                {
                    q: "What is UAB's research computing cluster called?",
                    options: ["Dragon", "Blazer", "Cheaha", "Vulcan"],
                    answer: 2,
                    why: "Cheaha is UAB's high-performance computing cluster, named for the highest point in Alabama. Neuroimaging pipelines are largely parallel across subjects, so they map well onto a scheduled cluster like this one."
                }
            ]
        };
    </script>
