        <header>
            <span class="eyebrow">Incoming self-assessment &middot; 10 questions</span>
            <h1>Basic Neuroscience</h1>
            <p class="subtitle">Cells, synapses, and gross organization of the nervous system. Nothing is recorded and
                nothing is graded: answer, then read the explanations.</p>

        <main id="quiz-root">
            <noscript>
                <p class="noscript-note">This quiz is interactive and needs JavaScript enabled.</p>
            </noscript>
        </main>

    <script>
        window.QUIZ = {
            questions: [
                {
                    q: "What is the basic functional unit of the nervous system?",
                    options: ["Glia", "Neuron", "Axon"],
                    answer: 1,
                    why: "The neuron is the signaling unit: it integrates its inputs and produces an all-or-none action potential. Glia outnumber neurons and are essential for myelination, metabolic support, and synaptic regulation, but they do not fire action potentials. An axon is one part of a neuron, not a unit on its own."
                },
                {
                    q: "Which part of the neuron receives signals from other neurons?",
                    options: ["Axon", "Cell body", "Dendrites"],
                    answer: 2,
                    why: "Dendrites carry the postsynaptic receptors, and the extent of their branching sets how much input a neuron can integrate. The cell body pools those graded potentials, and the axon carries the result away once threshold is crossed at the axon hillock."
                },
                {
                    q: "What is the function of myelin?",
                    options: ["Connect neurons together", "Insulate axons to speed up signal transmission", "Produce neurotransmitters"],
                    answer: 1,
                    why: "Myelin, from oligodendrocytes in the CNS and Schwann cells in the PNS, insulates the axon so current jumps between nodes of Ranvier. This saltatory conduction raises conduction velocity roughly tenfold. Losing it slows or blocks conduction, and the resulting white matter change is what diffusion imaging is sensitive to."
                },
                {
                    q: "What is the role of neurotransmitters?",
                    options: ["Store genetic information", "Provide energy to neurons", "Transmit signals across synapses"],
                    answer: 2,
                    why: "An arriving action potential opens voltage-gated calcium channels, vesicles fuse with the presynaptic membrane, and transmitter crosses the synaptic cleft to bind postsynaptic receptors. That chemical step is where most neuroactive drugs, and most synaptic plasticity, act."
                },
                {
                    q: "Which part of the brain is responsible for coordination and balance?",
                    options: ["Cerebellum", "Cerebrum", "Brainstem"],
                    answer: 0,
                    why: "The cerebellum holds more than half the neurons in the brain and tunes the timing and accuracy of movement rather than initiating it. Damage produces ataxia and dysmetria, not paralysis."
                },
                {
                    q: "What is the blood-brain barrier?",
                    options: ["A protective barrier that regulates substances entering the brain", "A part of the immune system", "A type of neuron"],
                    answer: 0,
                    why: "Tight junctions between capillary endothelial cells, supported by astrocyte end-feet and pericytes, control what crosses from blood into brain. It matters directly in imaging: gadolinium contrast normally stays inside the vessels, so enhancement on MRI marks where the barrier has broken down."
                },
                {
                    q: "Which lobe of the brain is primarily involved in vision?",
                    options: ["Frontal lobe", "Occipital lobe", "Temporal lobe"],
                    answer: 1,
                    why: "Primary visual cortex (V1) sits around the calcarine sulcus in the occipital lobe. From there the ventral stream runs forward into temporal cortex and the dorsal stream into parietal cortex, so vision is far from occipital alone."
                },
                {
                    q: "What is synaptic plasticity?",
                    options: ["The growth of new neurons", "The ability of synapses to strengthen or weaken over time", "The process of neurotransmitter release"],
                    answer: 1,
                    why: "Long-term potentiation and long-term depression change synaptic strength with use, and that is the cellular substrate most models of learning rest on. Growing new neurons is neurogenesis, a separate process."
                },
                {
                    q: "Which neurotransmitter system do SSRI antidepressants act on directly?",
                    options: ["Dopamine", "Acetylcholine", "Serotonin"],
                    answer: 2,
                    why: "Selective serotonin reuptake inhibitors block the serotonin transporter, leaving more serotonin in the cleft. Note the gap that makes this interesting: the reuptake block is immediate but the clinical effect takes weeks, so the transporter is the drug target rather than the full mechanism."
                },
                {
                    q: "What is neurogenesis?",
                    options: ["The formation of new neurons", "The death of neurons", "The process of synaptic pruning"],
                    answer: 0,
                    why: "Neurogenesis is the birth of new neurons from neural stem cells. It is routine during development; how much continues in the adult human hippocampus is still actively disputed. Neuronal death is apoptosis, and pruning removes synapses rather than whole cells."
                }
            ]
        };
    </script>
