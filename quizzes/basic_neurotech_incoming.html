        content="A ten-question self-assessment on the engineering design process applied to neurotechnology, with an explanation for every answer.">

<body>
    <div class="container">
        <a href="index.html" class="back-link">&larr; All quizzes</a>

        <header>
            <span class="eyebrow">Incoming self-assessment &middot; 10 questions</span>
            <h1>Engineering Design Process</h1>
            <p class="subtitle">How the design loop runs when the device has to work in a person: framing, criteria,
                prototypes, iteration, and ethics. Nothing is recorded and nothing is graded.</p>
        </header>

        <main id="quiz-root">
            <noscript>
                <p class="noscript-note">This quiz is interactive and needs JavaScript enabled.</p>
            </noscript>
        </main>
    </div>

    <script>
        window.QUIZ = {
            questions: [
                {
                    q: "What is the first step in the engineering design process?",
                    options: ["Identify the problem", "Build a prototype", "Test the solution"],
                    answer: 0,
                    why: "Everything downstream inherits the problem statement, so this is where a mistake is most expensive. Framing it as a need rather than a solution, as in clinicians cannot distinguish X from Y at the bedside rather than we should build a handheld scanner, keeps the design space open."
                },
                {
                    q: "In developing neurotechnology, why is it important to define clear criteria and constraints?",
                    options: ["To increase the cost of development", "To ensure the solution is feasible and meets user needs", "To limit creativity"],
                    answer: 1,
                    why: "Criteria are what a good solution maximizes; constraints are what it must not violate, such as power budget, MRI compatibility, biocompatibility, regulatory class, and cost. Written down early and in measurable terms, they turn later design arguments into comparisons."
                },
                {
                    q: "What is the purpose of brainstorming in the design process?",
                    options: ["To finalize the design", "To eliminate all ideas quickly", "To generate a wide range of ideas without judgment"],
                    answer: 2,
                    why: "Divergent and convergent thinking work badly at the same time. Separating them lets the half-formed ideas that often seed good ones survive long enough to be built on, with selection happening afterward against the stated criteria."
                },
                {
                    q: "Why is prototyping crucial in neurotechnology development?",
                    options: ["To complete the final product", "To test and refine ideas in a tangible form", "To conduct market analysis"],
                    answer: 1,
                    why: "A prototype converts an assumption into an observation, and the right one to build first is the cheapest one that tests the riskiest assumption. In neurotechnology that risk usually sits at the tissue interface or in the human factors, not in the electronics."
                },
                {
                    q: "How does testing and evaluation fit into the design process?",
                    options: ["To end the project", "To assess how well the solution meets the criteria and constraints", "To increase production speed"],
                    answer: 1,
                    why: "Testing measures the design against the criteria set earlier, which is exactly why those criteria have to be stated in measurable terms. A test that cannot fail is not a test."
                },
                {
                    q: "Why is iteration important in the engineering design process?",
                    options: ["To improve the solution based on testing results", "To repeat the same mistakes", "To lengthen the project timeline"],
                    answer: 0,
                    why: "The process is a loop, not a line. Each cycle should retire the largest remaining uncertainty, and iterating early on cheap prototypes is what keeps the expensive late-stage iterations rare."
                },
                {
                    q: "What is the role of user feedback in developing neurotechnology?",
                    options: ["To enhance usability and effectiveness", "To reduce costs", "To finalize the design"],
                    answer: 0,
                    why: "The users include patients, caregivers, surgeons, and technologists, and each group carries constraints the engineering team cannot infer from the bench. Devices routinely fail on daily usability and adherence rather than on their core signal performance."
                },
                {
                    q: "At which point should ethical implications be considered in neurotechnology design?",
                    options: ["Only during testing", "Throughout the entire design process", "Only at the end"],
                    answer: 1,
                    why: "Consent, agency, privacy of neural data, equitable access, and what happens to a participant whose implant outlives the trial that funded it are design constraints, not a compliance checkbox. Raised at the end, they can no longer change decisions already fixed in hardware."
                },
                {
                    q: "What is systems thinking in the context of neurotechnology design?",
                    options: ["Focusing on individual parts only", "Ignoring external factors", "Understanding how different components interact within the whole system"],
                    answer: 2,
                    why: "An implant is one component in a system that also contains the tissue, the surgical workflow, the clinician, the caregiver, and the reimbursement path. Optimizing a component in isolation frequently degrades the system around it."
                },
                {
                    q: "Why is documentation important in the design process?",
                    options: ["To track progress and communicate effectively with stakeholders", "To increase paperwork", "To delay project completion"],
                    answer: 0,
                    why: "Design history is what makes a result reproducible, a failure diagnosable, and a regulatory submission possible. For a medical device the design history file is a requirement rather than an option."
                }
            ]
        };
    </script>
    <script src="quiz.js"></script>
