        <a href="index.html" class="back-link">&larr; All quizzes</a>

        <header>
            <span class="eyebrow">Incoming self-assessment &middot; 10 questions</span>
            <h1>Neuroengineering</h1>
            <p class="subtitle">Interfaces, implants, and stimulation: what the tools do and what each one costs you.
                Nothing is recorded and nothing is graded.</p>

        <main id="quiz-root">
            <noscript>
                <p class="noscript-note">This quiz is interactive and needs JavaScript enabled.</p>
            </noscript>

    <script>
        window.QUIZ = {
            questions: [
                {
                    q: "What is neuroengineering?",
                    options: ["A branch of civil engineering", "The application of engineering techniques to the nervous system", "The study of plant neurons"],
                    answer: 1,
                    why: "Neuroengineering brings engineering methods, including signal processing, materials science, control theory, and device design, to recording from and modulating the nervous system. It sits between neuroscience, electrical engineering, and clinical medicine."
                },
                {
                    q: "What is a brain-computer interface (BCI)?",
                    options: ["A technology that enables direct communication between the brain and an external device", "A type of smartphone", "A neural imaging technique"],
                    answer: 0,
                    why: "A BCI measures a neural signal, decodes an intent from it, and drives an external effector, closing the loop without the usual muscular output. Recording can be intracortical, electrocorticographic, or scalp EEG, and the decoder matters as much as the electrode."
                },
                {
                    q: "What is the purpose of neural implants?",
                    options: ["To measure blood pressure", "To monitor heart rate", "To restore or enhance neural function"],
                    answer: 2,
                    why: "Cochlear implants, deep brain stimulators, and retinal prostheses all substitute for or modulate neural signaling. The hard engineering constraints are chronic biocompatibility, power, and holding signal quality steady as the foreign body response develops."
                },
                {
                    q: "Which technology does deep brain stimulation (DBS) use?",
                    options: ["Magnetic fields", "Electrical impulses", "Ultrasound waves"],
                    answer: 1,
                    why: "DBS delivers high-frequency electrical pulses through a chronically implanted lead, typically in the subthalamic nucleus or globus pallidus for Parkinson disease, driven by a pulse generator implanted in the chest. Transcranial magnetic stimulation and focused ultrasound also reach the brain, but neither is what DBS refers to."
                },
                {
                    q: "What is optogenetics?",
                    options: ["A method for genetic sequencing", "A technique that uses light to control cells in living tissue", "A type of brain imaging"],
                    answer: 1,
                    why: "A light-gated ion channel such as channelrhodopsin is expressed in a targeted cell population, and light then excites or silences just those cells on a millisecond timescale. Because it requires delivering an opsin gene first, it remains largely a preclinical tool."
                },
                {
                    q: "What is the main goal of neuroprosthetics?",
                    options: ["To replace or enhance the function of damaged neural systems", "To improve cardiovascular health", "To increase muscle mass"],
                    answer: 0,
                    why: "A neuroprosthesis substitutes for a lost link in the sensory or motor chain, as a cochlear implant does for the hair cells, or as a robotic arm driven from motor cortex does for a missing limb."
                },
                {
                    q: "What does EEG stand for?",
                    options: ["Electromagnetic generation", "Electrogrid engineering", "Electroencephalography"],
                    answer: 2,
                    why: "EEG records the summed postsynaptic potentials of large, similarly oriented pyramidal cell populations at the scalp. It has millisecond temporal resolution but poor spatial resolution, because the skull blurs and attenuates the signal."
                },
                {
                    q: "What is the main practical advantage of scalp EEG over an implanted microelectrode array for a BCI?",
                    options: ["It resolves the activity of individual neurons", "It requires no surgery", "It has higher spatial resolution"],
                    answer: 1,
                    why: "Scalp EEG is non-invasive, so it carries no surgical risk and can be applied to anyone. The tradeoff runs hard the other way on signal quality: an intracortical array resolves single-unit and multi-unit activity with far more bandwidth, at the cost of a craniotomy and gradual signal loss as glial scarring develops around the electrodes."
                },
                {
                    q: "What is functional electrical stimulation (FES) used for?",
                    options: ["To activate muscles in individuals with paralysis", "To measure brain waves", "To enhance memory"],
                    answer: 0,
                    why: "FES applies current to peripheral nerve or muscle to produce contraction where descending control has been lost, as in foot-drop stimulators or grasp restoration after spinal cord injury. Pair it with a BCI decoder and a user's own cortical signals can drive their own muscles."
                },
                {
                    q: "What is the role of nanotechnology in neuroengineering?",
                    options: ["To build larger computers", "To create new types of batteries", "To develop tiny devices for neural monitoring and intervention"],
                    answer: 2,
                    why: "Nanoscale materials such as carbon nanotube coatings, nanowire probes, and flexible mesh electronics aim to reduce the electrode impedance and the mechanical mismatch that drive chronic signal loss, matching the device more closely to the tissue it sits in."
                }
            ]
        };
    </script>
