<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A teaching MRI scanner at 3 T for NBL 425/625: write pulse sequences in a small language, image phantoms, watch k-space fill, compare reconstructions, explore artifacts, and acquire a proton FID for spectroscopy.">
<meta name="color-scheme" content="light dark">
<title>MRI Simulator</title>
<link rel="stylesheet" href="style.css">
<script>
/* Runs before first paint. (1) Apply a saved light/dark choice so the
   page does not flash the wrong theme. (2) Record any script that fails
   to load or throws while loading, so app.js can name the missing part
   of the simulator instead of leaving a blank tab. (3) If app.js itself
   never starts, replace the loading note with an explanation. */
(function () {
    var MRI = window.MRI = window.MRI || {};
    MRI.bootErrors = [];
    try {
        var t = localStorage.getItem('mriSim.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* storage blocked: follow the system theme */ }
    window.addEventListener('error', function (e) {
        var el = e.target;
        if (el && el.tagName === 'SCRIPT') MRI.bootErrors.push({ kind: 'load', src: el.getAttribute('src') });
        else if (e.message) MRI.bootErrors.push({ kind: 'runtime', src: e.filename || '', message: e.message, line: e.lineno });
    }, true);
    window.addEventListener('load', function () {
        setTimeout(function () {
            if (MRI.app && MRI.app.booted) return;
            var box = document.getElementById('bootMsg');
            if (!box) return;
            var lines = MRI.bootErrors.map(function (b) {
                return b.kind === 'load' ? b.src + ' did not load' : (b.src || 'a script') + ': ' + b.message;
            });
            box.className = 'boot-msg is-error';
            box.textContent = 'The simulator could not start. ' + (lines.length ? lines.join('; ') + '.' : 'js/app.js did not run.') +
                ' Check that all files of the simulator are present, then reload.';
        }, 0);
    });
})();
</script>
</head>
<body>
<a class="skip-link" href="#panels">Skip to the simulator</a>

<header class="app-header">
  <div class="wrap">
    <a class="back-link" href="../../index.html">&larr; Back to Course Home</a>
    <div class="title-row">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
          <rect x="1" y="1" width="38" height="38" rx="9" fill="#0b0f17"/>
          <circle cx="20" cy="20" r="12.5" fill="none" stroke="#3b82f6" stroke-width="3"/>
          <circle cx="20" cy="20" r="7" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.55"/>
          <path d="M20 20 L27.5 12.5" stroke="#f0b429" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="20" cy="20" r="2.2" fill="#e5e9f0"/>
        </svg>
        <div class="brand-text">
          <h1>MRI Simulator</h1>
          <p class="subtitle">A teaching scanner at 3 T: write a sequence, image a phantom, watch k-space fill</p>
        </div>
      </div>
      <div class="header-tools">
        <span class="badge badge-field" title="Static field B0 and the proton Larmor frequency">3 T &middot; 127.73 MHz</span>
        <button type="button" class="btn btn-ghost theme-toggle" id="themeToggle" data-mode="auto" aria-label="Theme: automatic">
          <svg class="theme-icon ti-auto" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4z" fill="currentColor"/></svg>
          <svg class="theme-icon ti-light" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3.05 3.05l1.13 1.13M11.82 11.82l1.13 1.13M3.05 12.95l1.13-1.13M11.82 4.18l1.13-1.13"/></g></svg>
          <svg class="theme-icon ti-dark" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M13.6 10.3A6 6 0 0 1 5.7 2.4a6 6 0 1 0 7.9 7.9z" fill="currentColor"/></svg>
          <span class="theme-label">Auto</span>
        </button>
      </div>
    </div>
  </div>
</header>

<div class="console" id="console">
  <section class="scanbar" id="scanbar" aria-label="Scan controls">
    <div class="wrap scanbar-inner">
      <div class="scan-actions">
        <button type="button" class="btn btn-primary btn-acquire" id="btnAcquire" title="Run the sequence on the phantom and play it back">
          <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2.5 1.2v9.6L10.6 6z" fill="currentColor"/></svg>
          <span id="btnAcquireLabel">Acquire</span>
        </button>
        <button type="button" class="btn btn-stop" id="btnStop" disabled title="Stop the scan in progress" aria-label="Stop">
          <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><rect x="2" y="2" width="8" height="8" rx="1" fill="currentColor"/></svg>
          <span class="btn-text">Stop</span>
        </button>
        <label class="scan-speed">
          <span class="scan-speed-label">Speed</span>
          <select class="select select-sm" id="selSpeed" aria-label="Playback speed">
            <option value="instant">Instant</option>
            <option value="fast" selected>Fast (4 s)</option>
            <option value="slow">Slow (15 s)</option>
          </select>
        </label>
        <label class="toggle" title="Re-scan automatically (instantly) whenever the phantom, sequence, artifacts or coil change">
          <input type="checkbox" id="chkAuto" role="switch" checked>
          <span class="toggle-track" aria-hidden="true"></span>
          <span class="toggle-label">Auto<span class="auto-label-long"> re-scan</span></span>
        </label>
      </div>
      <div class="scan-status">
        <div class="scan-line">
          <span class="led" id="scanLed" data-state="idle" aria-hidden="true"></span>
          <span class="scan-state" id="scanState" role="status" aria-live="polite">Starting</span>
          <span class="scan-pct" id="scanPct" aria-hidden="true"></span>
          <span class="scan-msg" id="scanMsg"></span>
          <span class="scan-action" id="scanAction" hidden></span>
        </div>
        <div class="scan-summary" id="scanSummary">&nbsp;</div>
      </div>
      <div class="scan-thumbs">
        <button type="button" class="thumb" id="thumbK" title="k-space of coil 1 (log magnitude). Open the k-space tab." aria-label="k-space thumbnail, open the k-space tab">
          <canvas id="thumbKCanvas" aria-hidden="true"></canvas><span class="thumb-label" aria-hidden="true">k-space</span>
        </button>
        <button type="button" class="thumb" id="thumbImg" title="Reconstructed image. Open the Image tab." aria-label="Image thumbnail, open the Image tab">
          <canvas id="thumbImgCanvas" aria-hidden="true"></canvas><span class="thumb-label" aria-hidden="true">image</span>
        </button>
      </div>
    </div>
    <div class="scan-progress" id="scanProgress" role="progressbar" aria-label="Scan progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="scan-progress-fill" id="scanProgressFill"></div>
    </div>
  </section>
  <nav class="tabbar" aria-label="Simulator sections">
    <div class="wrap">
      <div class="tablist" id="tablist" role="tablist" aria-label="Simulator sections"></div>
    </div>
  </nav>
</div>

<main class="wrap panels" id="panels">
  <noscript>
    <div class="callout callout-warn noscript-note">
      This simulator runs entirely in your browser and needs JavaScript. Please enable JavaScript for this page and reload it.
    </div>
  </noscript>
  <div class="boot-msg" id="bootMsg">Loading the simulator&hellip;</div>
  <section class="tab-panel" id="tab-lessons" role="tabpanel" aria-labelledby="tabbtn-lessons" hidden></section>
  <section class="tab-panel" id="tab-scanner" role="tabpanel" aria-labelledby="tabbtn-scanner" hidden></section>
  <section class="tab-panel" id="tab-phantom" role="tabpanel" aria-labelledby="tabbtn-phantom" hidden></section>
  <section class="tab-panel" id="tab-sequence" role="tabpanel" aria-labelledby="tabbtn-sequence" hidden></section>
  <section class="tab-panel" id="tab-contrast" role="tabpanel" aria-labelledby="tabbtn-contrast" hidden></section>
  <section class="tab-panel" id="tab-kspace" role="tabpanel" aria-labelledby="tabbtn-kspace" hidden></section>
  <section class="tab-panel" id="tab-image" role="tabpanel" aria-labelledby="tabbtn-image" hidden></section>
  <section class="tab-panel" id="tab-artifacts" role="tabpanel" aria-labelledby="tabbtn-artifacts" hidden></section>
  <section class="tab-panel" id="tab-spectro" role="tabpanel" aria-labelledby="tabbtn-spectro" hidden></section>
</main>
